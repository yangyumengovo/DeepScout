name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Lint（ruff）
        run: ruff check .
      - name: 单元测试（mock 模式，无需 API key）
        run: pytest -q
